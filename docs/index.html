<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Gros Chaton</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f4f1; --bubble: #ffffff; --ink: #26241f; --muted: #8b877e;
    --accent: #e08a2e; --accent-deep: #b96a12; --accent-soft: #f9ead6;
    --user: #26241f; --user-ink: #faf8f4; --error: #b3261e; --error-soft: #fdeceb;
    --border: #e3dfd7; --code-bg: #211f1c; --code-ink: #eae6df;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: #ffffff; border-bottom: 1px solid var(--border);
  }
  .cat-mark {
    position: relative; flex: none; width: 36px; height: 36px; border-radius: 10px;
    background:
      radial-gradient(circle at 34% 58%, #fff 0 2.4px, transparent 3px),
      radial-gradient(circle at 66% 58%, #fff 0 2.4px, transparent 3px),
      var(--accent);
  }
  .cat-mark::before, .cat-mark::after {
    content: ""; position: absolute; top: -5px; width: 14px; height: 14px;
    background: var(--accent); clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .cat-mark::before { left: 1px; transform: rotate(-20deg); }
  .cat-mark::after { right: 1px; transform: rotate(20deg); }
  h1 { margin: 0; font-size: 17px; letter-spacing: .01em; }
  .subtitle { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  main {
    flex: 1; width: 100%; max-width: 760px; margin: 0 auto;
    overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 16px;
    background: var(--bubble); border: 1px solid var(--border);
    line-height: 1.5; font-size: 14.5px; overflow-wrap: break-word;
  }
  .msg.user .bubble {
    background: var(--user); color: var(--user-ink);
    border-color: var(--user); border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble { border-bottom-left-radius: 4px; }
  .msg.error .bubble {
    background: var(--error-soft); border-color: #f0c4c0; color: var(--error);
  }
  .text p { margin: 0 0 8px; white-space: pre-wrap; }
  .text p:last-child { margin-bottom: 0; }
  pre {
    margin: 8px 0; padding: 12px; border-radius: 10px;
    background: var(--code-bg); color: var(--code-ink); overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55;
  }
  pre:first-child { margin-top: 0; }
  pre:last-child { margin-bottom: 0; }
  .msg.user pre { background: rgba(255, 255, 255, .08); color: inherit; }
  .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 15px 17px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  .composer {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 12px 16px; background: #ffffff; border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; background: var(--bg); outline: none;
    font: inherit; font-size: 14.5px; line-height: 1.5; max-height: 160px;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .actions { display: flex; gap: 8px; }
  button {
    border: 1px solid var(--border); border-radius: 10px; background: #ffffff;
    color: var(--ink); padding: 10px 14px; font: inherit; font-size: 13.5px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent-deep); }
  #send { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
  #send:hover { background: var(--accent-deep); }
  footer {
    text-align: center; padding: 8px; font-size: 12px; color: var(--muted);
    background: #ffffff; border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
  <header>
    <div class="cat-mark" aria-hidden="true"></div>
    <div>
      <h1>Le Gros Chaton</h1>
      <p class="subtitle">Q4 quantized · Qwen3.5-9B · Terminal-Bench 2.0 25%</p>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask Le Gros Chaton a question or paste a terminal problem..."></textarea>
    <div class="actions">
      <button id="clear" type="button" title="Reset the conversation">Clear</button>
      <button id="send" type="button">Send</button>
    </div>
  </div>

  <footer>Reviews welcome</footer>

<script>
  // Backend: a Cloudflare tunnel to a vLLM server speaking the OpenAI API.
  const API_URL = "https://media-displaying-nissan-sudden.trycloudflare.com";
  const MODEL = "le-gros-chaton";
  const thread = []; // conversation shown (user/assistant/error roles)
  let awaiting = false;

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");

  function welcomeMessage() {
    return {
      role: "assistant",
      content: "Welcome! I'm Le Gros Chaton — the big kitten.\n\n" +
        "I am a 9B coding agent built on Qwen3.5-9B and fine-tuned on terminal-bench traces. " +
        "That means I am happiest on terminal tasks: writing shell commands, debugging builds, " +
        "and reasoning about what happens when code actually runs. My Q4 quantized weights " +
        "keep me quick on modest hardware.\n\n" +
        "Ask me anything, or hand me a terminal problem to chew on. " +
        "If you see a 502 error, my backend tunnel is asleep — give it a moment and retry."
    };
  }
  function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  // Render message text; split ``` fenced blocks out into monospace <pre> blocks.
  function renderContent(text) {
    const frag = document.createDocumentFragment();
    String(text).split(/```/).forEach(function (part, i) {
      if (i % 2 === 1) {
        const body = part.replace(/^\n/, "").replace(/^[a-zA-Z0-9_+.-]+\n/, "");
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = body;
        pre.appendChild(code);
        frag.appendChild(pre);
      } else if (part.trim() !== "") {
        const p = document.createElement("p");
        p.textContent = part;
        frag.appendChild(p);
      }
    });
    return frag;
  }
  function bubbleFor(message) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (message.role === "error" ? "error" : message.role);
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const text = document.createElement("div");
    text.className = "text";
    text.appendChild(renderContent(message.content));
    bubble.appendChild(text);
    wrap.appendChild(bubble);
    return wrap;
  }
  function typingBubble() {
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("span");
      dot.className = "dot";
      bubble.appendChild(dot);
    }
    wrap.appendChild(bubble);
    return wrap;
  }
  function render() {
    chatEl.textContent = "";
    thread.forEach(function (m) { chatEl.appendChild(bubbleFor(m)); });
    if (awaiting) chatEl.appendChild(typingBubble());
    scrollToBottom();
  }
  function reset() {
    thread.length = 0;
    thread.push(welcomeMessage());
    render();
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || awaiting) return;
    thread.push({ role: "user", content: text });
    inputEl.value = "";
    inputEl.style.height = "auto";
    awaiting = true;
    sendBtn.disabled = true;
    render();
    try {
      const res = await fetch(API_URL + "/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          messages: thread.filter(m => m.role === "user" || m.role === "assistant"),
          temperature: 0.7,
          max_tokens: 1024,
          chat_template_kwargs: { enable_thinking: false }
        })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const content = data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content
        : "(The model returned an empty response.)";
      thread.push({ role: "assistant", content: String(content) });
    } catch (err) {
      const status = /HTTP (\d+)/.exec(err.message);
      thread.push({
        role: "error",
        content: status
          ? "Something went wrong — the model server answered with " + status[1] +
            ". That usually means the backend is down; give it a moment and try again."
          : "Could not reach the model server. Check that the backend tunnel is up, then try again."
      });
    } finally {
      awaiting = false;
      sendBtn.disabled = false;
      render();
      inputEl.focus();
    }
  }

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", function () {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });
  sendBtn.addEventListener("click", send);
  clearBtn.addEventListener("click", function () {
    if (awaiting) return;
    reset();
    inputEl.focus();
  });

  reset();
  inputEl.focus();
</script>
</body>
</html>
