name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Check formatting (black)
        run: |
          black --check --line-length 99 *.py agent/*.py eval/*.py verify/*.py tests/*.py

      - name: Check imports (isort)
        run: |
          isort --check-only --profile black --line-length 99 *.py agent/*.py eval/*.py verify/*.py tests/*.py

      - name: Lint (ruff)
        run: |
          ruff check *.py agent/*.py eval/*.py verify/*.py tests/*.py

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python3 -c "
          import ast, glob, sys
          files = glob.glob('*.py') + glob.glob('agent/*.py') + glob.glob('eval/*.py') + glob.glob('verify/*.py') + glob.glob('tests/*.py')
          errors = []
          for f in sorted(files):
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'FAIL: {e}')
              sys.exit(1)
          print(f'{len(files)} .py files — all syntax OK')
          "

  test-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install min deps
        run: |
          python -m pip install --upgrade pip
          # Only install what the torch-free tests need:
          pip install pytest numpy tiktoken datasets tokenizers

      - name: Run torch-free tests
        run: |
          python -m pytest tests/ -k "not needs_torch" -v --tb=short
