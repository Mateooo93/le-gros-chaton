[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "le-fat-chaton"
version = "0.4.0-dev"
description = "A from-scratch Mixture-of-Experts coding agent transformer with 6-stage RL pipeline (pretrain → RFT → RLVR → PRM → Agent RL)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
    {name = "Mateo", email = "mateo@hackclub.com"},
]

keywords = ["transformer", "moe", "coding-agent", "llm", "pytorch"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "tiktoken>=0.5",
    "datasets>=2.14",
    "huggingface_hub>=0.19",
    "tokenizers>=0.15",
]

[project.urls]
Homepage = "https://github.com/Mateooo93/le-gros-chaton"
Repository = "https://github.com/Mateooo93/le-gros-chaton.git"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.0",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "eval*", "verify*"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # naming conventions
    "UP",   # pyupgrade (modern Python)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (black handles this)
    "N812",  # lowercase imported as non-lowercase
    "B904",  # raise-within-try (explicit exception chain)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports OK in __init__
"tests/*.py" = ["N", "SIM"]  # test files can bend naming rules

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 99